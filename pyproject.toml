[project]
name = "cinemastudio"
version = "0.1.0"
description = "AI short-film pipeline: logline -> shot list -> moodboards -> Seedance 2.0 clips, ready for manual editing."
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40.0",
    "click>=8.1.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.0",
    "pillow>=10.0.0",
    "pydantic>=2.7.0",
    "python-multipart>=0.0.9",
    "rich>=13.7.0",
    "sse-starlette>=2.1.0",
    "tenacity>=8.5.0",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
cinema = "cinemastudio.cli:cli"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["cinemastudio*"]
